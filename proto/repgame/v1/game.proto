// RepGame 客户端 <-> 服务器协议（唯一事实来源）。
//
// 传输层：TLS 之上，每条消息 = 4 字节大端序长度 + 一条序列化后的
// ClientMessage / ServerMessage。
//
// 设计约定：
// - 消息类型由 oneof 的分支本身决定，不再依赖字符串 key 或数据库里的响应码。
// - 客户端只发送“意图”（要出哪几张牌的 UID），所有数值（伤害、血量、合成结果）
//   一律由服务器计算，客户端上报的数值不被信任。
// - 只追加字段，不复用/修改已有字段编号；删除字段时用 reserved 占位。
// - 枚举 0 值统一为 *_UNSPECIFIED，表示“未设置”。
syntax = "proto3";

package repgame.v1;

option go_package = "GoServer/tcpgameserver/pb;pb";
option csharp_namespace = "RepGame.Protocol";

// ============================================================
// 信封
// ============================================================

// 客户端 -> 服务器
message ClientMessage {
  // 客户端自增请求序号；服务器在对应回复的 reply_to 中原样带回。
  uint32 seq = 1;

  reserved 14, 15, 16; // 旧版回合制：play_cards / compose_cards / restart

  oneof body {
    LoginRequest login = 10;
    RegisterRequest register = 11;
    ResumeSessionRequest resume_session = 12;
    ReadyRequest ready = 13;
    Ping ping = 17;
    GameAction game_action = 18;   // 新版对局的所有操作
    CancelMatchRequest cancel_match = 19;  // 取消匹配
  }
}

// 服务器 -> 客户端
message ServerMessage {
  // 回复的是哪条请求（ClientMessage.seq）；服务器主动推送时为 0。
  uint32 reply_to = 1;

  reserved 13, 14; // 旧版回合制：game_state / bond_list

  oneof body {
    Error error = 2;
    Welcome welcome = 10;
    AuthResult auth_result = 11;
    RegisterResult register_result = 12;
    PlayerPresence player_presence = 15;
    Pong pong = 16;
    MatchConfig match_config = 17;   // 开局下发一次：卡牌、羁绊、法宝、家世的静态数据
    MatchState match_state = 18;     // 每次状态变化后推送的完整视图
    RoundResult round_result = 19;   // 每回合结算
    MatchOver match_over = 20;       // 对局结束
    MatchmakingState matchmaking = 21;  // 匹配状态（开始 / 取消匹配的回复）
  }
}

// ============================================================
// 通用
// ============================================================

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;      // 消息无法解析或缺少必要字段
  ERROR_CODE_NOT_AUTHENTICATED = 2;    // 需要先登录
  ERROR_CODE_INVALID_CREDENTIALS = 3;  // 用户名或密码错误
  ERROR_CODE_USER_EXISTS = 4;          // 注册时用户名已存在
  ERROR_CODE_SESSION_EXPIRED = 5;      // 会话令牌无效或已过期
  ERROR_CODE_INVALID_GAME_STATE = 6;   // 当前状态下不能执行该操作
  ERROR_CODE_INVALID_CARDS = 7;        // 牌不在手牌中、重复或数量不合法
  ERROR_CODE_INTERNAL = 8;             // 服务器内部错误
  ERROR_CODE_NOT_ENOUGH_GOLD = 9;      // 金币不足
  ERROR_CODE_BENCH_FULL = 10;          // 备战席已满
  ERROR_CODE_RELIC_SLOTS_FULL = 11;    // 法宝栏已满
  ERROR_CODE_MAX_LEVEL = 12;           // 已满级
  ERROR_CODE_INVALID_CHOICE = 13;      // 选项、卡牌、栏位或布局不合法
}

message Error {
  ErrorCode code = 1;
  string message = 2; // 给人看的说明，客户端逻辑不应依赖其内容
}

message Ping {
  int64 client_time_ms = 1;
}

message Pong {
  int64 client_time_ms = 1; // 原样带回，用于计算延迟
  int64 server_time_ms = 2;
}

// ============================================================
// 连接与账号
// ============================================================

message Welcome {
  int64 server_time_ms = 1;
  uint32 protocol_version = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2; // 仅在 TLS 连接中传输；服务器以 bcrypt 哈希存储
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

// 断线重连时用登录拿到的令牌恢复会话，无需再次发送密码。
message ResumeSessionRequest {
  string session_token = 1;
}

// 登录或恢复会话成功
message AuthResult {
  string username = 1;
  string session_token = 2;
  int64 session_expires_at_ms = 3;
}

message RegisterResult {
  string username = 1;
}

// ============================================================
// 对局：客户端意图
// ============================================================

message ReadyRequest {}

message CancelMatchRequest {}

// 匹配状态：searching = true 表示已在匹配队列中
message MatchmakingState {
  bool searching = 1;
}

// ============================================================
// 在线状态
// ============================================================

enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_DISCONNECTED = 1; // 掉线，等待重连
  PRESENCE_STATUS_RECONNECTED = 2;
}

// 同房间其他玩家的在线状态变化
message PlayerPresence {
  string username = 1;
  string room_id = 2;
  PresenceStatus status = 3;
  string reason = 4;
}

// ============================================================
// 新版对局（商店 + 合成 + 法宝）
// ------------------------------------------------------------
// 服务器权威：客户端只发送操作意图，所有判定、计分、伤害由服务器完成。
// 每个成功的操作都会以 MatchState（reply_to = 该请求的 seq）回复，
// 并同时推送给对手；失败则回复 Error。
// ============================================================

// ---------- 客户端操作 ----------

message GameAction {
  oneof action {
    PickFamily pick_family = 1;
    BuyCard buy_card = 2;
    SellCard sell_card = 3;
    RefreshShop refresh_shop = 4;
    BuyXp buy_xp = 5;
    BuyRelic buy_relic = 6;
    SellRelic sell_relic = 7;
    ArrangeBoard arrange = 8;
    LockShop lock_shop = 9;
    SetReady set_ready = 10;
    PickVault pick_vault = 11;
    SkipVault skip_vault = 12;
    Surrender surrender = 13;
    SettleDone settle_done = 14;
  }
}

// 结算过场（含伤害动画）播放完毕；双方都发出后立即进入下一阶段，不必等结算倒计时。
message SettleDone {}
message PickFamily { int32 offer_index = 1; }        // MatchState.family_offer 的下标
message BuyCard { int32 shop_slot = 1; }              // MatchState.self.shop 的下标
message SellCard { string card_uid = 1; }
message RefreshShop {}
message BuyXp {}
message BuyRelic { int32 trade_choice = 1; }          // 需要选行当的法宝填 MatchConfig.trades 的下标
message SellRelic { int32 relic_slot = 1; }
// 出阵从左到右的卡；其余卡回到备战席。relic_order 为空表示不改法宝顺序。
message ArrangeBoard {
  repeated string board_uids = 1;
  repeated int32 relic_order = 2;
}
message LockShop { bool locked = 1; }
message SetReady { bool ready = 1; }
message PickVault {
  int32 offer_index = 1;
  int32 sell_relic_slot = 2;  // 法宝栏已满时先卖掉的栏位；-1 表示不卖
  int32 trade_choice = 3;
}
message SkipVault {}
message Surrender {}   // 认输：对局立即结束，发起方判负

// ---------- 静态数据（开局下发一次） ----------

message TierInfo {
  int32 at = 1;
  string desc = 2;
}

message BondInfo {
  string key = 1;
  string name = 2;
  string desc = 3;
  repeated TierInfo tiers = 4;
  repeated string line_keys = 5;
}

message LineInfo {
  string key = 1;
  string name = 2;
  repeated string star_names = 3;
  int32 cost = 4;
  int32 points = 5;
  string trade_key = 6;
  string origin_key = 7;
  string legend_desc = 8;
}

message RelicInfo {
  string key = 1;
  string name = 2;
  int32 rarity = 3;          // MatchConfig.rarities 的下标
  string desc = 4;
  bool needs_trade_choice = 5;
}

message RarityInfo {
  string key = 1;
  string name = 2;
  int32 price = 3;
}

message FamilyInfo {
  string key = 1;
  string name = 2;
  string desc = 3;
}

message MatchConfig {
  string room_id = 1;
  repeated LineInfo lines = 2;
  repeated BondInfo trades = 3;
  repeated BondInfo origins = 4;
  repeated RelicInfo relics = 5;
  repeated RarityInfo rarities = 6;
  repeated FamilyInfo families = 7;
  int32 max_star = 8;
  int32 bench_size = 9;
  int32 refresh_cost = 10;
  int32 xp_cost = 11;
  int32 max_level = 12;
  int32 start_hp = 13;          // 初始血量（血条上限）
  double bond_tier_mult = 14;   // 每个生效羁绊档位的通用倍率加成
}

// ---------- 动态状态 ----------

enum MatchPhase {
  MATCH_PHASE_UNSPECIFIED = 0;
  MATCH_PHASE_FAMILY = 1;    // 选家世
  MATCH_PHASE_PREP = 2;      // 准备阶段
  MATCH_PHASE_SETTLE = 3;    // 结算演出中（不能操作）
  MATCH_PHASE_VAULT = 4;     // 宝库
  MATCH_PHASE_OVER = 5;
}

message ChessCard {
  string uid = 1;
  string line_key = 2;
  int32 star = 3;
  string name = 4;
  int32 points = 5;   // 当前点数（含永久加成）
  int32 bonus = 6;    // 永久加成部分
  int32 sell_price = 7;
}

message RelicSlot {
  string relic_key = 1;
  double value = 2;        // 成长值
  int32 trade_choice = 3;  // -1 表示无
  int32 sell_price = 4;
}

message ShopSlot {
  string line_key = 1;   // 为空表示该格已买走或空
  int32 cost = 2;
  int32 owned = 3;       // 已拥有的同系同星（1★）张数，便于提示合成
}

message BondCount {
  string key = 1;
  int32 count = 2;
  int32 tier = 3;   // -1 = 未生效，否则为 tiers 下标
}

enum ScoreStepKind {
  SCORE_STEP_KIND_UNSPECIFIED = 0;
  SCORE_STEP_KIND_POINTS = 1;
  SCORE_STEP_KIND_ADD_MULT = 2;
  SCORE_STEP_KIND_TIMES_MULT = 3;
}

message ScoreStep {
  int32 phase = 1;          // 1 逐卡 2 备战席 3 羁绊 4 3★ 技能 5 法宝
  string source = 2;        // 卡名 / 羁绊名 / 法宝名
  string card_uid = 3;
  int32 relic_slot = 4;     // -1 表示不是法宝
  ScoreStepKind kind = 5;
  double value = 6;
  double points = 7;        // 本步之后
  double mult = 8;
  int32 trigger = 9;        // 本步是第几次触发（从 1 开始）
  int32 triggers = 10;      // 共触发几次；>1 时客户端显示"第 n/N 次触发"
}

message ScoreBreakdown {
  double points = 1;
  double mult = 2;
  double score = 3;
  repeated ScoreStep steps = 4;
}

message SelfView {
  int32 hp = 1;
  int32 gold = 2;
  int32 level = 3;
  int32 xp = 4;
  int32 xp_to_next = 5;      // 满级为 0
  int32 slots = 6;
  int32 relic_slots = 7;
  repeated ChessCard board = 8;
  repeated ChessCard bench = 9;
  repeated RelicSlot relics = 10;
  repeated ShopSlot shop = 11;
  string shop_relic_key = 12;   // 为空表示没有
  bool shop_locked = 13;
  int32 free_refreshes = 14;
  int32 interest = 15;          // 下回合预计利息
  int32 family = 16;            // MatchConfig.families 下标，-1 = 未选
  int32 win_streak = 17;
  int32 loss_streak = 18;
  bool ready = 19;
  repeated BondCount trade_bonds = 20;
  repeated BondCount origin_bonds = 21;
  ScoreBreakdown preview = 22;  // 服务器算好的预计得分
}

message OpponentView {
  string username = 1;
  int32 hp = 2;
  int32 level = 3;
  int32 gold = 4;
  int32 card_count = 5;         // 出阵 + 备战席
  repeated RelicSlot relics = 6;
  int32 family = 7;
  repeated ChessCard last_board = 8;  // 上一回合结算时的出阵
  double last_score = 9;
  bool ready = 10;
  bool connected = 11;
}

message MatchState {
  string room_id = 1;
  MatchPhase phase = 2;
  int32 round = 3;
  int64 phase_deadline_ms = 4;     // 服务器时间；0 = 无倒计时
  int32 stage_damage = 5;          // 本回合阶段伤害
  SelfView self = 6;
  OpponentView opponent = 7;
  repeated int32 family_offer = 8; // 家世阶段可选项（MatchConfig.families 下标）
  repeated string vault_offer = 9; // 宝库可选法宝 key
}

message SideResult {
  string username = 1;
  repeated ChessCard board = 2;
  repeated RelicSlot relics = 3;
  ScoreBreakdown score = 4;
  int32 damage_taken = 5;
  int32 hp_after = 6;
}

message RoundResult {
  string room_id = 1;
  int32 round = 2;
  SideResult self = 3;
  SideResult opponent = 4;
  int32 winner = 5;      // 1 = 我方胜，-1 = 对方胜，0 = 平局
  bool match_over = 6;
  bool vault_next = 7;
  int64 next_phase_at_ms = 8;  // 演出结束、进入下一阶段的服务器时间
}

message MatchOver {
  string room_id = 1;
  int32 result = 2;      // 1 胜，-1 负，0 平
  int32 rounds = 3;
  int32 hp = 4;
  int32 opponent_hp = 5;
  bool surrendered = 6;  // 有一方认输而结束（result 为 -1 时是自己认输）
}
