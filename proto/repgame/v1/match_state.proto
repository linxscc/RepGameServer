// 对局：动态状态（阶段、棋子、计分、回合结算、结束）。
syntax = "proto3";

package repgame.v1;

option go_package = "GoServer/tcpgameserver/pb;pb";
option csharp_namespace = "RepGame.Protocol";

import "repgame/v1/match_config.proto";

// ---------- 动态状态 ----------

enum MatchPhase {
  MATCH_PHASE_UNSPECIFIED = 0;
  MATCH_PHASE_FAMILY = 1;    // 选家世
  MATCH_PHASE_PREP = 2;      // 准备阶段
  MATCH_PHASE_SETTLE = 3;    // 结算演出中（不能操作）
  MATCH_PHASE_VAULT = 4;     // 宝库
  MATCH_PHASE_OVER = 5;
  MATCH_PHASE_OMEN = 6;      // 天象掷骰（天象回合开始时，准备阶段之前）
}

message ChessCard {
  string uid = 1;
  string line_key = 2;
  int32 star = 3;
  string name = 4;
  int32 points = 5;   // 当前点数（含永久加成）
  int32 bonus = 6;    // 永久加成部分
  int32 sell_price = 7;
  CardColor color = 8;
}

message RelicSlot {
  string relic_key = 1;
  double value = 2;        // 成长值
  int32 trade_choice = 3;  // -1 表示无
  int32 sell_price = 4;
}

message ShopSlot {
  string line_key = 1;   // 为空表示该格已买走或空
  int32 cost = 2;
  int32 owned = 3;       // 已拥有的同系同星（1★）张数，便于提示合成
  CardColor color = 4;   // 空格为 UNSPECIFIED
}

message BondCount {
  string key = 1;
  int32 count = 2;
  int32 tier = 3;   // -1 = 未生效，否则为 tiers 下标
  int32 at_delta = 4; // 本回合各档位所需数量的增加量（失和）；实际要求 = TierInfo.at + at_delta
}

enum ScoreStepKind {
  SCORE_STEP_KIND_UNSPECIFIED = 0;
  SCORE_STEP_KIND_POINTS = 1;
  SCORE_STEP_KIND_ADD_MULT = 2;
  SCORE_STEP_KIND_TIMES_MULT = 3;
}

enum StepOrigin {
  STEP_ORIGIN_OWN = 0;        // 自己的卡 / 羁绊 / 法宝
  STEP_ORIGIN_FOE_RELIC = 1;  // 对手的法宝
  STEP_ORIGIN_OMEN = 2;       // 天象（relic_slot = -1，source = 天象名）
}

message ScoreStep {
  int32 phase = 1;          // 1 逐卡 2 备战席 3 羁绊 4 3★ 技能 5 法宝；origin 为对手法宝时 relic_slot 是对手法宝栏位置
  string source = 2;        // 卡名 / 羁绊名 / 法宝名
  string card_uid = 3;
  int32 relic_slot = 4;     // -1 表示不是法宝
  ScoreStepKind kind = 5;
  double value = 6;
  double points = 7;        // 本步之后
  double mult = 8;
  int32 trigger = 9;        // 本步是第几次触发（从 1 开始）
  int32 triggers = 10;      // 共触发几次；>1 时客户端显示"第 n/N 次触发"
  StepOrigin origin = 11;   // 步骤来源：自己 / 对手法宝 / 天象
}

message ScoreBreakdown {
  double points = 1;
  double mult = 2;
  double score = 3;
  repeated ScoreStep steps = 4;
}

message SelfView {
  int32 hp = 1;
  int32 gold = 2;
  int32 level = 3;
  int32 xp = 4;
  int32 xp_to_next = 5;      // 满级为 0
  int32 slots = 6;
  int32 relic_slots = 7;
  repeated ChessCard board = 8;
  repeated ChessCard bench = 9;
  repeated RelicSlot relics = 10;
  repeated ShopSlot shop = 11;
  string shop_relic_key = 12;   // 为空表示没有
  bool shop_locked = 13;
  int32 free_refreshes = 14;
  int32 interest = 15;          // 下回合预计利息
  int32 family = 16;            // MatchConfig.families 下标，-1 = 未选
  int32 win_streak = 17;
  int32 loss_streak = 18;
  bool ready = 19;
  repeated BondCount trade_bonds = 20;
  repeated BondCount origin_bonds = 21;
  ScoreBreakdown preview = 22;  // 服务器算好的预计得分
  int32 bench_size = 23;        // 本回合备战席格数（含天象修正）
  int32 refresh_cost = 24;      // 本回合刷新费用（含天象修正）
}

message OpponentView {
  string username = 1;
  int32 hp = 2;
  int32 level = 3;
  int32 gold = 4;
  int32 card_count = 5;         // 出阵 + 备战席
  repeated RelicSlot relics = 6;
  int32 family = 7;
  repeated ChessCard last_board = 8;  // 上一回合结算时的出阵
  double last_score = 9;
  bool ready = 10;
  bool connected = 11;
}

message MatchState {
  string room_id = 1;
  MatchPhase phase = 2;
  int32 round = 3;
  int64 phase_deadline_ms = 4;     // 服务器时间；0 = 无倒计时
  int32 stage_damage = 5;          // 本回合阶段伤害
  SelfView self = 6;
  OpponentView opponent = 7;
  repeated int32 family_offer = 8; // 家世阶段可选项（MatchConfig.families 下标）
  repeated string vault_offer = 9; // 宝库可选法宝 key
  repeated ActiveOmenView omens = 10; // 本回合生效中的天象（按出现顺序）
  OmenRollView omen_roll = 11;        // 最近一次天象掷骰；无则为空
}

message ActiveOmenView {
  string key = 1;
  int32 rounds_left = 2;   // 含本回合的剩余回合数
  int32 from_round = 3;    // 出现的回合
}

// OMEN 阶段中只填 round / self_chosen / opponent_chosen（骰子为 0，不暴露对方选择）；
// 揭晓后（该回合）填完整结果。
message OmenRollView {
  int32 round = 1;
  int32 self_die = 2;        // 0 = 没掷
  int32 opponent_die = 3;
  bool forced = 4;           // 双方都不掷，系统替双方各掷一次
  int32 total = 5;           // 两骰之和
  string omen_key = 6;
  bool shifted = 7;          // 与生效中的天象重复，点数顺延
  bool self_chosen = 8;      // 本方已选择（OMEN 阶段中）/ 本方选择了掷（揭晓后）
  bool opponent_chosen = 9;
  int32 point = 10;          // 顺延后的点数
}

message SideResult {
  string username = 1;
  repeated ChessCard board = 2;
  repeated RelicSlot relics = 3;
  ScoreBreakdown score = 4;
  int32 damage_taken = 5;
  int32 hp_after = 6;
}

message RoundResult {
  string room_id = 1;
  int32 round = 2;
  SideResult self = 3;
  SideResult opponent = 4;
  int32 winner = 5;      // 1 = 我方胜，-1 = 对方胜，0 = 平局
  bool match_over = 6;
  bool vault_next = 7;
  int64 next_phase_at_ms = 8;  // 演出结束、进入下一阶段的服务器时间
}

message MatchOver {
  string room_id = 1;
  int32 result = 2;      // 1 胜，-1 负，0 平
  int32 rounds = 3;
  int32 hp = 4;
  int32 opponent_hp = 5;
  bool surrendered = 6;  // 有一方认输而结束（result 为 -1 时是自己认输）
}
