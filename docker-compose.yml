services:
  db:
    image: mysql:8.4
    container_name: repgame_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
      MYSQL_DATABASE: RepGame
      MYSQL_USER: repgameadmin
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_EXPOSE_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    image: repgame:local
    container_name: repgame_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
      - "${BIND_ADDRESS:-0.0.0.0}:${GAME_PORT:-9060}:9060"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: RepGame
      WEB_DB_NAME: InsByMyself
      VOYARA_DB_NAME: Voyara
      DB_USER: repgameadmin
      DB_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      VOYARA_JWT_SECRET: ${VOYARA_JWT_SECRET:-replace-with-at-least-32-random-characters}
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_DIR: /var/lib/repgame/uploads
      LOCAL_UPLOAD_URL: /uploads
      TZ: ${TZ:-Asia/Tokyo}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET_KEY: ${PAYPAL_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-southeast-2}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot
      - letsencrypt_data:/etc/letsencrypt:ro
      - ./downloads:/usr/share/nginx/downloads:ro
      - uploads_data:/var/lib/repgame/uploads

  ddns:
    image: curlimages/curl:8.14.1
    container_name: repgame_namecheap_ddns
    restart: unless-stopped
    profiles: ["ddns"]
    environment:
      DDNS_DOMAIN: ${DDNS_DOMAIN:-zsdimain.site}
      DDNS_HOST: ${DDNS_HOST:-@}
      DDNS_PASSWORD: ${NAMECHEAP_DDNS_PASSWORD:-}
      DDNS_INTERVAL: ${DDNS_INTERVAL:-300}
    volumes:
      - ./docker/ddns/update-namecheap.sh:/update-namecheap.sh:ro
    entrypoint: ["/bin/sh", "/update-namecheap.sh"]

  certbot:
    image: certbot/certbot:latest
    container_name: repgame_certbot
    restart: unless-stopped
    profiles: ["tls"]
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-zsdimain.site}
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - ./nginx/certbot:/var/www/certbot
      - ./docker/certbot/renew.sh:/renew.sh:ro
    entrypoint: ["/bin/sh", "/renew.sh"]

volumes:
  mysql_data:
  uploads_data:
  letsencrypt_data:
