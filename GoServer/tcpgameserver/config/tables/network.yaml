# ============================================================
# 网络与账号安全配置表
# ------------------------------------------------------------
# 帧格式、心跳与认证相关的数值。与客户端相关的值（心跳间隔、
# 账号长度限制）需要和客户端 StreamingAssets/Config 中的配置保持一致。
# ============================================================

connection:
  # 监听地址（容器内端口，对外端口由 docker-compose 映射）
  listen_addr: ":9060"
  # 单条消息的最大字节数；超过即断开连接，防止恶意大包
  max_frame_bytes: 1048576
  # TLS 握手必须在该时间内完成（秒）
  handshake_timeout_seconds: 10
  # 超过该时间没有收到客户端任何消息即视为断线（秒）。
  # 客户端心跳间隔应明显小于该值（客户端默认 15 秒）。
  idle_timeout_seconds: 45
  # 连接管理器的兜底清理：超过 stale_connection_seconds 没有活动的连接记录会被移除，
  # 每 cleanup_interval_minutes 检查一次。正常断线由上面的 idle_timeout 处理，
  # 这里只清理异常残留的记录；它也决定了“等待重连”的玩家最多能保留多久。
  stale_connection_seconds: 30
  cleanup_interval_minutes: 3600

auth:
  # bcrypt 计算强度（10~14），越大越安全但登录越慢
  bcrypt_cost: 12
  # 登录后会话令牌的有效期（小时），用于断线重连免密恢复
  session_ttl_hours: 24
  # 用户名长度（字符数）
  username_min_length: 3
  username_max_length: 32
  # 密码长度（字节数）；bcrypt 只使用前 72 字节，所以上限不能超过 72
  password_min_length: 6
  password_max_length: 72
