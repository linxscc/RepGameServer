# ============================================================
# 羁绊配置表
# ------------------------------------------------------------
# 一次出牌中同时包含某个羁绊的全部卡牌时触发，触发后这些卡牌的
# 伤害由羁绊伤害替代（取总伤害最高的组合，见 logic/bond_calculator.go）。
# 来源：客户端 StreamingAssets/Config/BondConfig.sql（按卡牌名称关联）。
#
# 字段说明：
#   id          羁绊编号，唯一
#   name        羁绊名称（客户端显示）
#   level       羁绊等级
#   damage      触发后的伤害
#   skill       技能标识（预留，当前未使用）
#   description 说明文字（客户端悬停提示中显示）
#   cards       组成羁绊的卡牌名称，必须在 cards.yaml 中存在，最多 7 张
# ============================================================
