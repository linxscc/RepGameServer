# ============================================================
# 卡牌配置表
# ------------------------------------------------------------
# 每张卡牌在一局中的牌池数量、伤害、等级和合成目标。
# 来源：客户端 StreamingAssets/Config/CardDeck.json（原 CardDeck 数据表）。
#
# 字段说明：
#   id      卡牌编号，唯一，不要修改已有编号
#   name    卡牌名称；必须与客户端卡牌预制体 Prefabs/Cards/<name>.prefab 同名
#   count   每个房间牌池中该卡牌的数量
#   damage  打出该卡牌的基础伤害
#   level   等级 1~3；1 级卡用于开局发牌和补牌，2/3 级卡只能通过合成获得
#   target  合成目标：同名卡凑够 game_rules.yaml 的 compose.group_size 张后，
#           合成为 1 张 target；留空表示不能继续合成
# 启动时会校验：名称不重复、target 存在且等级正好高一级、每个等级都有牌。
# ============================================================
