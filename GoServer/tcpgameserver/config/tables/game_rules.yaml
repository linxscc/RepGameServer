# ============================================================
# 匹配规则配置表
# ------------------------------------------------------------
# 对局本身的数值（经济、阵容、战斗等）见 chess_*.yaml。
# 修改后重新部署即可生效；也可以把同名文件放到 GAME_CONFIG_DIR
# 指定的目录中覆盖（无需重新编译）。
# 所有数值在启动时做合法性校验，非法配置会导致服务器拒绝启动。
# ============================================================

# ---------- 匹配 ----------
match:
  # 每个房间的玩家数量（含机器人）。目前对局只支持 2 人（1v1）。
  players_per_room: 2
