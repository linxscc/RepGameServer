# ============================================================
# 对局规则数值配置表
# ------------------------------------------------------------
# 修改后重新部署即可生效；也可以把同名文件放到 GAME_CONFIG_DIR
# 指定的目录中覆盖（无需重新编译）。
# 所有数值在启动时做合法性校验，非法配置会导致服务器拒绝启动。
# ============================================================

# ---------- 匹配 ----------
match:
  # 每个房间的玩家数量（含机器人）。目前回合逻辑只支持 2 人对战。
  players_per_room: 2

# ---------- 玩家 ----------
player:
  # 对局开始时每位玩家的血量（也是血量上限）
  initial_health: 50
  # 对局开始时发到每位玩家手中的 1 级卡牌数量
  initial_hand_size: 6
  # 手牌上限；抽牌时超出上限的部分不再发放
  max_hand_cards: 10
  # 每次出牌后为出牌方补充的卡牌数量
  draw_after_play: 3

# ---------- 回合 ----------
turn:
  # 人类玩家每回合的思考时间（秒）；超时由服务器自动打出手牌中的第一张
  timeout_seconds: 30

# ---------- 合成 ----------
compose:
  # 合成所需的同名卡牌数量；一次提交的卡牌数必须是它的整数倍
  group_size: 3
