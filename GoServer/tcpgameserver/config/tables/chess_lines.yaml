# ============================================================
# 职业系表：每个系有 1★/2★/3★ 三张卡面，3★ 自带一个传说技能
# ------------------------------------------------------------
# key     系的编号（代码与协议使用，不要修改已有 key）
# stars   各星级卡名，必须与客户端卡面 Prefabs/Cards/<名字> 同名
# cost    商店价格（也是费用档）
# points  1★ 点数；每升一星 × merge.star_multiplier
# pool    每个房间共享卡池中的 1★ 数量
# trade   行当羁绊（chess_bonds.yaml 的 trades）
# origin  出身羁绊（chess_bonds.yaml 的 origins）
# legend  3★ 技能：key 见 rules/effects.go 的 legendParams，params 为数值
# ============================================================
lines:
  - key: carpenter
    name: 木灵
    stars: [木魅, 槐树姥姥, 句芒]
    cost: 1
    points: 2
    pool: 13
    trade: craft
    origin: rural
    legend: { key: mult_per_high_star, desc: 出阵中每张 2★ 及以上的卡 +1 气势, params: { mult: 1 } }
  - key: smith
    name: 炉火
    stars: [炉精, 毕方, 祝融]
    cost: 1
    points: 2
    pool: 13
    trade: craft
    origin: market
    legend: { key: grow_on_merge, desc: 每次合成永久 +6 战力（每回合最多 3 次）, params: { points: 6 } }
  - key: farmer
    name: 社稷
    stars: [稻草精, 土地公, 后土]
    cost: 1
    points: 2
    pool: 13
    trade: craft
