    card: 黄巾力士
    cost: 1
    points: 2
    pool: 13
    trade: monk
    origin: hall
    legend: { key: retrigger_left, desc: 最左边 1 个法宝额外触发 1 次, params: { count: 1 } }
  - key: monk
    name: 佛门
    card: 木鱼沙弥
    cost: 1
    points: 2
    pool: 13
    trade: monk
    origin: rural
    legend: { key: mult_per_relic, desc: 每持有一个法宝 +1 气势, params: { mult: 1 } }
  - key: scholar
