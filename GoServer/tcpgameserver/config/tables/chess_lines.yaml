    points: 2
    pool: 13
    trade: monk
    origin: hall
    legend: { key: retrigger_left, desc: 最左边 1 个法宝额外触发 1 次, params: { count: 1 } }
  - key: monk
    name: 佛门
    stars: [木鱼沙弥, 伏虎金刚, 地藏王]
