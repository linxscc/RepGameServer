# ============================================================
# 职业系表：每个系有 1★/2★/3★ 三张卡面，3★ 自带一个传说技能
# ------------------------------------------------------------
# key     系的编号（代码与协议使用，不要修改已有 key）
# stars   各星级卡名，必须与客户端卡面 Prefabs/Cards/<名字> 同名
# cost    商店价格（也是费用档）
# points  1★ 点数；每升一星 × merge.star_multiplier
# pool    每个房间共享卡池中的 1★ 数量
# trade   行当羁绊（chess_bonds.yaml 的 trades）
# origin  出身羁绊（chess_bonds.yaml 的 origins）
# legend  3★ 技能：key 见 rules/effects.go 的 legendParams，params 为数值
# ============================================================
lines:
  - key: carpenter
    name: 木匠
    stars: [木匠学徒, 木匠, 百工专家]
    cost: 1
    points: 2
    pool: 13
    trade: craft
    origin: rural
    legend: { key: mult_per_high_star, desc: 出阵中每张 2★ 及以上的卡 +1 倍率, params: { mult: 1 } }
  - key: smith
    name: 铁匠
    stars: [铁匠学徒, 铁匠, 铸剑师]
    cost: 1
    points: 2
    pool: 13
    trade: craft
    origin: market
    legend: { key: grow_on_merge, desc: 每次合成永久 +6 点（每回合最多 3 次）, params: { points: 6 } }
  - key: farmer
    name: 农
    stars: [农民学徒, 农民, 神农]
    cost: 1
    points: 2
    pool: 13
    trade: craft
    origin: rural
    legend: { key: own_origin_count, desc: 乡野羁绊计数 +1, params: { count: 1 } }
  - key: taoist
    name: 道
    stars: [道童, 道士, 天师]
    cost: 1
    points: 2
    pool: 13
    trade: monk
    origin: hall
    legend: { key: retrigger_left, desc: 最左边 1 个法宝额外触发 1 次, params: { count: 1 } }
  - key: monk
    name: 僧
    stars: [沙弥, 和尚, 住持]
    cost: 1
    points: 2
    pool: 13
    trade: monk
    origin: rural
    legend: { key: mult_per_relic, desc: 每持有一个法宝 +1 倍率, params: { mult: 1 } }
  - key: scholar
    name: 学
    stars: [学生, 学者, 教授]
    cost: 1
    points: 2
    pool: 13
    trade: letter
    origin: hall
    legend: { key: mult_per_level, desc: +倍率，数值等于等级 × 2, params: { mult: 2 } }
  - key: doctor
    name: 医
    stars: [医学生, 医师, 医圣]
    cost: 2
    points: 3
    pool: 11
    trade: monk
    origin: market
    legend: { key: damage_taken, desc: 受到的伤害 ×0.7（向上取整）, params: { factor: 0.7 } }
  - key: artist
    name: 艺
    stars: [艺术学徒, 梦想家, 艺术家]
    cost: 2
    points: 3
    pool: 11
    trade: letter
    origin: market
    legend: { key: mult_per_bond, desc: 每个生效中的羁绊 +2 倍率, params: { mult: 2 } }
  - key: designer
    name: 设计
    stars: [设计学徒, 设计师, 营造宗师]
    cost: 2
    points: 3
    pool: 11
    trade: letter
    origin: hall
    legend: { key: mult_per_line, desc: 出阵中每个不同的系 +1 倍率, params: { mult: 1 } }
  - key: trader
    name: 商
    stars: [小贩, 游商, 商人]
    cost: 2
    points: 3
    pool: 11
    trade: court
    origin: market
    legend: { key: interest, desc: 利息改为每 10 金 +2，上限 +10, params: { rate: 2, cap: 10 } }
  - key: soldier
    name: 兵
    stars: [兵卒, 老兵, 统领]
    cost: 3
    points: 5
    pool: 9
    trade: court
    origin: rural
    legend: { key: times_mult, desc: 倍率 ×2, params: { factor: 2 } }
  - key: clerk
    name: 吏
    stars: [吏员, 官员, 相国]
    cost: 3
    points: 5
    pool: 9
    trade: court
    origin: hall
    legend: { key: extra_slots, desc: 出阵格 +1（下回合起生效）, params: { slots: 1 } }
