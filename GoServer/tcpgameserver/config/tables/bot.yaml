# ============================================================
# 机器人对局配置表
# ------------------------------------------------------------
# 玩家点击“开始匹配”后，若在 match_wait_seconds 内没有匹配到
# 真人对手，服务器会自动安排一名机器人与其对战。
# ============================================================

# 是否启用机器人对局；关闭后玩家会一直等待真人对手
enabled: true

# 玩家开始匹配后，等待真人对手的最长时间（秒），超时后加入机器人
match_wait_seconds: 3

# 机器人显示名称的前缀，后面会拼接随机编号，例如“机器人-4821”。
# 以该前缀开头的用户名不允许注册，避免与真人玩家重名。
name_prefix: "机器人-"

# 轮到机器人时，它“思考”多久后出牌（毫秒），避免瞬间出牌显得突兀
think_delay_ms: 1500

# 机器人一次最多打出的卡牌数量。机器人会在
# “单张卡牌”和“同名卡牌组合”中选择伤害最高的一种出法。
max_cards_per_play: 3
