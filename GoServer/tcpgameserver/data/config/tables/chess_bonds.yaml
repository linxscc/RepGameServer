# ============================================================
# 羁绊表：按出阵中「不同的系」计数，达到 at 即生效，只取最高一档
# ------------------------------------------------------------
# 每档的 desc 是给玩家看的说明；values 是通用修正项（均按本回合出阵判断），可自由组合：
#     points_per_card      每张出阵卡 +点
#     add_mult             +气势
#     times_mult           ×气势
# 另有通用奖励：每个生效档位 +battle.bond_tier_mult 气势（见 chess_rules.yaml）
# ============================================================
trades:
  - key: craft
    name: 天工
    desc: 加气势
    tiers:
      - { at: 2, desc: +4 气势, values: { add_mult: 4 } }
      - { at: 3, desc: +10 气势, values: { add_mult: 10 } }
  - key: letter
    name: 文墨
    desc: 加气势
    tiers:
      - { at: 2, desc: +2 气势, values: { add_mult: 2 } }
      - { at: 3, desc: +6 气势, values: { add_mult: 6 } }
  - key: monk
    name: 方外
    desc: 加战力
    tiers:
      - { at: 2, desc: 每张出阵卡 +3 战力, values: { points_per_card: 3 } }
      - { at: 3, desc: 每张出阵卡 +8 战力, values: { points_per_card: 8 } }
  - key: court
    name: 敕令
    desc: 乘气势
    tiers:
      - { at: 2, desc: 气势 ×1.3, values: { times_mult: 1.3 } }
      - { at: 3, desc: 气势 ×2, values: { times_mult: 2 } }

origins:
  - key: rural
    name: 山野
    desc: 加战力
    tiers:
      - { at: 2, desc: 每张出阵卡 +2 战力, values: { points_per_card: 2 } }
      - { at: 4, desc: 每张出阵卡 +6 战力, values: { points_per_card: 6 } }
  - key: market
    name: 市井
    desc: 加气势
    tiers:
      - { at: 2, desc: +3 气势, values: { add_mult: 3 } }
      - { at: 4, desc: +9 气势, values: { add_mult: 9 } }
  - key: hall
    name: 庙堂
    desc: 乘气势
    tiers:
      - { at: 2, desc: 气势 ×1.2, values: { times_mult: 1.2 } }
      - { at: 4, desc: 气势 ×1.6, values: { times_mult: 1.6 } }
